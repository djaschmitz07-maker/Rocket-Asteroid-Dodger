<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rocket Asteroid Dodger</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #070913;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* HUD & Overlays */
        #hud {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .hud-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stat-box {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(99, 102, 241, 0.35);
            backdrop-filter: blur(6px);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .stat-label {
            color: #94a3b8;
            font-size: 0.75rem;
            text-transform: uppercase;
            display: block;
            margin-bottom: 2px;
        }

        #pauseBtn {
            pointer-events: auto;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(99, 102, 241, 0.45);
            backdrop-filter: blur(6px);
            color: #f8fafc;
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
        }

        #pauseBtn:hover {
            background: rgba(30, 41, 59, 0.9);
            border-color: #38bdf8;
            transform: scale(1.05);
        }

        #pauseBtn:active {
            transform: scale(0.95);
        }

        /* Pause & Countdown Overlays */
        #pauseOverlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 8, 17, 0.78);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
            z-index: 25;
            transition: opacity 0.25s ease;
        }

        #pauseOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .pause-title {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #f8fafc;
            margin-bottom: 24px;
            text-shadow: 0 4px 18px rgba(56, 189, 248, 0.4);
        }

        #countdownOverlay {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 22;
        }

        #countdownOverlay.hidden {
            display: none;
        }

        #countdownText {
            font-size: clamp(4.5rem, 12vw, 7.5rem);
            font-weight: 900;
            color: #38bdf8;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.8), 0 6px 20px rgba(0, 0, 0, 0.7);
            animation: popScale 0.85s ease-out infinite;
        }

        @keyframes popScale {
            0% { transform: scale(0.65); opacity: 0.4; }
            30% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.85; }
        }

        #overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.75) 0%, rgba(5, 8, 17, 0.92) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
            z-index: 20;
            transition: opacity 0.3s ease;
        }

        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: clamp(2.2rem, 6vw, 3.8rem);
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            filter: drop-shadow(0 4px 12px rgba(56, 189, 248, 0.3));
        }

        .instructions {
            max-width: 440px;
            color: #cbd5e1;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .highlight {
            color: #38bdf8;
            font-weight: 700;
        }

        .action-btn {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            border: none;
            padding: 16px 42px;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5), inset 0 2px 2px rgba(255, 255, 255, 0.3);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            text-transform: uppercase;
        }

        .action-btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.7), inset 0 2px 2px rgba(255, 255, 255, 0.4);
        }

        .action-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        #finalScoreBox {
            display: none;
            margin-bottom: 24px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.25);
            padding: 16px 32px;
            border-radius: 16px;
        }

        #finalScoreVal {
            font-size: 2.5rem;
            font-weight: 900;
            color: #fbbf24;
        }

        /* Subtle visual guide for left/right touch zones */
        .zone-hint {
            display: flex;
            gap: 20px;
            margin-bottom: 28px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .zone-pill {
            border: 1px dashed rgba(148, 163, 184, 0.4);
            padding: 8px 16px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.5);
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="stat-box">
            <span class="stat-label">Score</span>
            <span id="scoreDisplay">0</span>
        </div>
        <div class="hud-right">
            <div class="stat-box">
                <span class="stat-label">Best</span>
                <span id="bestDisplay">0</span>
            </div>
            <button id="pauseBtn" aria-label="Pause Game" title="Pause">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="6" y="4" width="4" height="16" rx="1.5"></rect>
                    <rect x="14" y="4" width="4" height="16" rx="1.5"></rect>
                </svg>
            </button>
        </div>
    </div>

    <div id="pauseOverlay" class="hidden">
        <div class="pause-title">Paused</div>
        <button class="action-btn" id="resumeBtn">Resume</button>
    </div>

    <div id="countdownOverlay" class="hidden">
        <div id="countdownText">3</div>
    </div>

    <div id="overlay">
        <h1 id="overlayTitle">Astro Dodge</h1>
        <div id="finalScoreBox">
            <span class="stat-label">Final Score</span>
            <div id="finalScoreVal">0</div>
        </div>
        <p class="instructions" id="overlayDesc">
            Hold the <span class="highlight">LEFT</span> side of the screen to bank left.<br>
            Hold the <span class="highlight">RIGHT</span> side of the screen to bank right.<br>
            Release to straighten out and fly straight up!
        </p>
        <div class="zone-hint">
            <div class="zone-pill">◀ Hold Left Half</div>
            <div class="zone-pill">Hold Right Half ▶</div>
        </div>
        <button class="action-btn" id="startBtn">Launch Rocket</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const scoreDisplay = document.getElementById('scoreDisplay');
        const bestDisplay = document.getElementById('bestDisplay');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayDesc = document.getElementById('overlayDesc');
        const finalScoreBox = document.getElementById('finalScoreBox');
        const finalScoreVal = document.getElementById('finalScoreVal');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const pauseOverlay = document.getElementById('pauseOverlay');
        const resumeBtn = document.getElementById('resumeBtn');
        const countdownOverlay = document.getElementById('countdownOverlay');
        const countdownText = document.getElementById('countdownText');

        // Game State: START, PLAYING, PAUSED, COUNTDOWN, GAMEOVER
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        let gameState = 'START';
        let score = 0;
        let bestScore = localStorage.getItem('rocketDodgeBest') || 0;
        bestDisplay.textContent = bestScore;

        // Countdown State
        let countdownTimer = 0;
        let lastCountdownInt = 3;

        // Input State (-1 = left, 0 = none/straight, 1 = right)
        let inputDir = 0;
        let activeTouches = new Map();

        // Visual feedback ripples when clicking left/right sides
        let touchIndicators = [];

        // Entities
        let stars = [];
        let asteroids = [];
        let particles = [];
        let screenShake = 0;

        // Rocket Object
        const rocket = {
            x: width / 2,
            y: height - 120,
            width: 38,
            height: 68,
            vx: 0,
            maxSpeed: 460,
            accel: 2200,
            friction: 1500,
            angle: 0,           // Current visual tilt in radians
            targetAngle: 0,     // Desired tilt based on input
            angleVel: 0,        // Smooth angular velocity for fluid banking
            maxTilt: 0.46,      // ~26 degrees tilt
            flameFlicker: 0
        };

        // Stationary / Camping Detection State
        let idleTime = 0;
        let lastCheckedX = rocket.x;
        let sniperWarningTimer = 0;

        // Resize Handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            rocket.y = height - Math.max(100, height * 0.15);
            if (rocket.x > width - 30) rocket.x = width - 30;
            if (rocket.x < 30) rocket.x = 30;
        }
        window.addEventListener('resize', resize);

        // Initialize Starfield Background
        function initStars() {
            stars = [];
            const count = Math.floor((width * height) / 7000);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 0.6,
                    speed: Math.random() * 140 + 60,
                    alpha: Math.random() * 0.7 + 0.3
                });
            }
        }

        // Spawn Visual Click Ripple
        function addTouchIndicator(x, y, dir) {
            touchIndicators.push({
                x,
                y,
                dir,
                radius: 10,
                maxRadius: 65,
                alpha: 0.6
            });
        }

        // Pause & Resume Logic
        function pauseGame() {
            if (gameState !== 'PLAYING') return;
            gameState = 'PAUSED';
            inputDir = 0;
            activeTouches.clear();
            pauseBtn.style.display = 'none';
            pauseOverlay.classList.remove('hidden');
        }

        function startResumeCountdown() {
            if (gameState !== 'PAUSED') return;
            pauseOverlay.classList.add('hidden');
            countdownOverlay.classList.remove('hidden');
            gameState = 'COUNTDOWN';
            countdownTimer = 3.0;
            lastCountdownInt = 3;
            countdownText.textContent = '3';
        }

        pauseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            pauseGame();
        });

        resumeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startResumeCountdown();
        });

        // Input Handling (Mouse & Touch anywhere on Left/Right screen halves)
        function updateInputFromClientX(clientX, clientY, isNewPress = false) {
            if (gameState !== 'PLAYING') return;
            if (clientX < width / 2) {
                inputDir = -1;
            } else {
                inputDir = 1;
            }
            if (isNewPress) {
                addTouchIndicator(clientX, clientY, inputDir);
            }
        }

        // Mouse Events
        canvas.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            updateInputFromClientX(e.clientX, e.clientY, true);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (e.buttons === 1 && gameState === 'PLAYING') {
                updateInputFromClientX(e.clientX, e.clientY, false);
            }
        });

        window.addEventListener('mouseup', () => {
            if (activeTouches.size === 0) {
                inputDir = 0;
            }
        });

        // Touch Events
        canvas.addEventListener('touchstart', (e) => {
            if (gameState !== 'PLAYING') return;
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                const dir = t.clientX < width / 2 ? -1 : 1;
                activeTouches.set(t.identifier, dir);
                inputDir = dir;
                addTouchIndicator(t.clientX, t.clientY, dir);
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (gameState !== 'PLAYING') return;
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                const dir = t.clientX < width / 2 ? -1 : 1;
                activeTouches.set(t.identifier, dir);
                inputDir = dir;
            }
        }, { passive: false });

        function handleTouchEnd(e) {
            for (let i = 0; i < e.changedTouches.length; i++) {
                activeTouches.delete(e.changedTouches[i].identifier);
            }
            if (activeTouches.size > 0) {
                const values = Array.from(activeTouches.values());
                inputDir = values[values.length - 1];
            } else {
                inputDir = 0;
            }
        }
        canvas.addEventListener('touchend', handleTouchEnd);
        canvas.addEventListener('touchcancel', handleTouchEnd);

        // Optional Keyboard Support (Arrow Keys / A & D / Escape to pause)
        const keysDown = {};
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
                if (gameState === 'PLAYING') pauseGame();
                else if (gameState === 'PAUSED') startResumeCountdown();
                return;
            }
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                keysDown.left = true;
                if (gameState === 'PLAYING') inputDir = -1;
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                keysDown.right = true;
                if (gameState === 'PLAYING') inputDir = 1;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                keysDown.left = false;
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                keysDown.right = false;
            }
            if (!keysDown.left && !keysDown.right && activeTouches.size === 0) {
                inputDir = 0;
            } else if (keysDown.left && gameState === 'PLAYING') {
                inputDir = -1;
            } else if (keysDown.right && gameState === 'PLAYING') {
                inputDir = 1;
            }
        });

        // Asteroid Generator (supports normal random asteroids and fast targeted anti-camping asteroids)
        function spawnAsteroid(targetedX = null) {
            const isSniper = targetedX !== null;
            const radius = isSniper ? (Math.random() * 10 + 24) : (Math.random() * 26 + 20);
            const x = isSniper
                ? Math.max(radius, Math.min(width - radius, targetedX))
                : Math.random() * (width - radius * 2) + radius;
            const y = -radius - 25;

            // Speed scales smoothly with score; targeted anti-camping asteroids move at 2x speed straight down
            const difficultyMultiplier = 1 + Math.min(score / 45, 1.8);
            const baseVy = (Math.random() * 140 + 210) * difficultyMultiplier;
            const vy = isSniper ? baseVy * 2.0 : baseVy;
            const vx = isSniper ? 0 : (Math.random() - 0.5) * 70;
            const rotSpeed = isSniper ? ((Math.random() < 0.5 ? -1 : 1) * 5.5) : ((Math.random() - 0.5) * 3.2);

            // Create rugged polygon vertices
            const vertices = [];
            const numPoints = Math.floor(Math.random() * 5) + 9;
            for (let i = 0; i < numPoints; i++) {
                const theta = (i / numPoints) * Math.PI * 2;
                const variance = 0.76 + Math.random() * 0.34;
                vertices.push({
                    x: Math.cos(theta) * radius * variance,
                    y: Math.sin(theta) * radius * variance
                });
            }

            // Procedural craters
            const craters = [];
            const craterCount = Math.floor(Math.random() * 3) + 2;
            for (let i = 0; i < craterCount; i++) {
                const cAngle = Math.random() * Math.PI * 2;
                const cDist = Math.random() * (radius * 0.45);
                craters.push({
                    x: Math.cos(cAngle) * cDist,
                    y: Math.sin(cAngle) * cDist,
                    r: radius * (0.14 + Math.random() * 0.14)
                });
            }

            asteroids.push({
                x,
                y,
                radius,
                vx,
                vy,
                angle: Math.random() * Math.PI * 2,
                rotSpeed,
                vertices,
                craters,
                passed: false,
                isSniper
            });
        }

        // Particle Emitter (Thruster exhaust & explosion sparks)
        function emitExhaust() {
            const cos = Math.cos(rocket.angle);
            const sin = Math.sin(rocket.angle);
            const nozzleOffset = rocket.height * 0.48;
            const px = rocket.x - sin * nozzleOffset + (Math.random() - 0.5) * 8;
            const py = rocket.y + cos * nozzleOffset;

            const colors = ['#38bdf8', '#fbbf24', '#f97316', '#ffffff'];
            particles.push({
                x: px,
                y: py,
                vx: -sin * 120 + (Math.random() - 0.5) * 45,
                vy: cos * 160 + Math.random() * 80,
                size: Math.random() * 5 + 3,
                alpha: 1,
                decay: Math.random() * 2.5 + 2.2,
                color: colors[Math.floor(Math.random() * colors.length)]
            });
        }

        function emitExplosion(x, y) {
            const colors = ['#ef4444', '#f97316', '#fbbf24', '#38bdf8', '#ffffff'];
            for (let i = 0; i < 65; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 380 + 60;
                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 7 + 3,
                    alpha: 1,
                    decay: Math.random() * 1.2 + 0.8,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }

        // Reset & Start Game
        function startGame() {
            score = 0;
            scoreDisplay.textContent = '0';
            asteroids = [];
            particles = [];
            touchIndicators = [];
            inputDir = 0;
            activeTouches.clear();

            rocket.x = width / 2;
            rocket.y = height - Math.max(100, height * 0.15);
            rocket.vx = 0;
            rocket.angle = 0;
            rocket.targetAngle = 0;
            rocket.angleVel = 0;

            idleTime = 0;
            lastCheckedX = rocket.x;
            sniperWarningTimer = 0;

            spawnTimer = 0;
            gameState = 'PLAYING';
            overlay.classList.add('hidden');
            pauseOverlay.classList.add('hidden');
            countdownOverlay.classList.add('hidden');
            pauseBtn.style.display = 'flex';
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            inputDir = 0;
            activeTouches.clear();
            pauseBtn.style.display = 'none';
            screenShake = 18;
            emitExplosion(rocket.x, rocket.y);

            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('rocketDodgeBest', bestScore);
                bestDisplay.textContent = bestScore;
            }

            setTimeout(() => {
                overlayTitle.textContent = 'Hull Breached!';
                overlayDesc.innerHTML = 'Watch out for incoming asteroid fields.<br>Hold left or right to bank, release to fly straight.';
                finalScoreBox.style.display = 'block';
                finalScoreVal.textContent = score;
                startBtn.textContent = 'Fly Again';
                overlay.classList.remove('hidden');
            }, 650);
        }

        startBtn.addEventListener('click', startGame);

        // Draw Detailed Sleek Spaceship/Rocket
        function drawRocket() {
            if (gameState === 'GAMEOVER') return;

            ctx.save();
            ctx.translate(rocket.x, rocket.y);
            ctx.rotate(rocket.angle);

            const w = rocket.width;
            const h = rocket.height;

            // Dynamic Thruster Flame
            if (gameState === 'PLAYING') {
                rocket.flameFlicker += 0.35;
            }
            const flameLen = (inputDir !== 0 ? 34 : 26) + Math.sin(rocket.flameFlicker) * 7;

            // Outer Flame
            const flameGrad = ctx.createLinearGradient(0, h * 0.42, 0, h * 0.42 + flameLen);
            flameGrad.addColorStop(0, '#38bdf8');
            flameGrad.addColorStop(0.5, '#f97316');
            flameGrad.addColorStop(1, 'rgba(239, 68, 68, 0)');

            ctx.beginPath();
            ctx.moveTo(-w * 0.24, h * 0.42);
            ctx.quadraticCurveTo(0, h * 0.42 + flameLen * 1.25, w * 0.24, h * 0.42);
            ctx.closePath();
            ctx.fillStyle = flameGrad;
            ctx.fill();

            // Inner Hot Core Flame
            ctx.beginPath();
            ctx.moveTo(-w * 0.12, h * 0.42);
            ctx.quadraticCurveTo(0, h * 0.42 + flameLen * 0.7, w * 0.12, h * 0.42);
            ctx.closePath();
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Left & Right Swept Fins
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.moveTo(-w * 0.32, h * 0.1);
            ctx.lineTo(-w * 0.72, h * 0.44);
            ctx.lineTo(-w * 0.32, h * 0.36);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(w * 0.32, h * 0.1);
            ctx.lineTo(w * 0.72, h * 0.44);
            ctx.lineTo(w * 0.32, h * 0.36);
            ctx.closePath();
            ctx.fill();

            // Center Stabilizer Fin
            ctx.fillStyle = '#dc2626';
            ctx.beginPath();
            ctx.moveTo(-3, h * 0.18);
            ctx.lineTo(0, h * 0.48);
            ctx.lineTo(3, h * 0.18);
            ctx.closePath();
            ctx.fill();

            // Engine Nozzle
            ctx.fillStyle = '#334155';
            ctx.beginPath();
            ctx.moveTo(-w * 0.25, h * 0.36);
            ctx.lineTo(-w * 0.3, h * 0.46);
            ctx.lineTo(w * 0.3, h * 0.46);
            ctx.lineTo(w * 0.25, h * 0.36);
            ctx.closePath();
            ctx.fill();

            // Main Fuselage Body with Metallic Shading
            const bodyGrad = ctx.createLinearGradient(-w * 0.4, 0, w * 0.4, 0);
            bodyGrad.addColorStop(0, '#cbd5e1');
            bodyGrad.addColorStop(0.35, '#ffffff');
            bodyGrad.addColorStop(0.75, '#e2e8f0');
            bodyGrad.addColorStop(1, '#94a3b8');

            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.moveTo(0, -h * 0.52);
            ctx.bezierCurveTo(w * 0.48, -h * 0.2, w * 0.45, h * 0.2, w * 0.32, h * 0.38);
            ctx.lineTo(-w * 0.32, h * 0.38);
            ctx.bezierCurveTo(-w * 0.45, h * 0.2, -w * 0.48, -h * 0.2, 0, -h * 0.52);
            ctx.closePath();
            ctx.fill();

            // Red Nose Cone Tip & Accent Stripe
            ctx.save();
            ctx.clip();
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(-w, -h * 0.55, w * 2, h * 0.22);
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(-w, h * 0.26, w * 2, h * 0.06);
            ctx.restore();

            // Cockpit Window
            const glassGrad = ctx.createRadialGradient(-3, -h * 0.08, 2, 0, -h * 0.05, w * 0.25);
            glassGrad.addColorStop(0, '#bae6fd');
            glassGrad.addColorStop(0.5, '#0284c7');
            glassGrad.addColorStop(1, '#0f172a');

            ctx.fillStyle = glassGrad;
            ctx.beginPath();
            ctx.arc(0, -h * 0.05, w * 0.22, 0, Math.PI * 2);
            ctx.fill();

            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#475569';
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.beginPath();
            ctx.ellipse(-w * 0.07, -h * 0.1, 3.5, 2, -0.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // Draw Jagged Asteroid
        function drawAsteroid(ast) {
            ctx.save();
            ctx.translate(ast.x, ast.y);

            // Fiery trail behind double-speed anti-camping asteroids
            if (ast.isSniper) {
                const trailGrad = ctx.createLinearGradient(0, -ast.radius * 3.2, 0, ast.radius * 0.5);
                trailGrad.addColorStop(0, 'rgba(239, 68, 68, 0)');
                trailGrad.addColorStop(0.6, 'rgba(249, 115, 22, 0.35)');
                trailGrad.addColorStop(1, 'rgba(239, 68, 68, 0.75)');
                ctx.fillStyle = trailGrad;
                ctx.beginPath();
                ctx.moveTo(-ast.radius * 0.85, 0);
                ctx.lineTo(0, -ast.radius * 3.4);
                ctx.lineTo(ast.radius * 0.85, 0);
                ctx.closePath();
                ctx.fill();
            }

            ctx.rotate(ast.angle);

            // Asteroid Body Gradient (subtle warm tint on fast targeted asteroids)
            const grad = ctx.createRadialGradient(-ast.radius * 0.3, -ast.radius * 0.3, ast.radius * 0.1, 0, 0, ast.radius);
            if (ast.isSniper) {
                grad.addColorStop(0, '#fca5a5');
                grad.addColorStop(0.55, '#7f1d1d');
                grad.addColorStop(1, '#291519');
            } else {
                grad.addColorStop(0, '#94a3b8');
                grad.addColorStop(0.6, '#475569');
                grad.addColorStop(1, '#1e293b');
            }

            ctx.fillStyle = grad;
            ctx.strokeStyle = ast.isSniper ? '#f87171' : '#334155';
            ctx.lineWidth = 2;

            ctx.beginPath();
            ast.vertices.forEach((v, idx) => {
                if (idx === 0) ctx.moveTo(v.x, v.y);
                else ctx.lineTo(v.x, v.y);
            });
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Craters
            ctx.fillStyle = 'rgba(15, 23, 42, 0.45)';
            ast.craters.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();
        }

        // Main Update Loop
        let lastTime = performance.now();
        let spawnTimer = 0;

        function update(dt) {
            // Freeze world completely while paused
            if (gameState === 'PAUSED') return;

            // Handle 3-2-1 Countdown before resuming
            if (gameState === 'COUNTDOWN') {
                countdownTimer -= dt;
                const currentInt = Math.ceil(countdownTimer);
                if (currentInt > 0 && currentInt !== lastCountdownInt) {
                    lastCountdownInt = currentInt;
                    countdownText.textContent = currentInt;
                    // Restart pop animation cleanly
                    countdownText.style.animation = 'none';
                    void countdownText.offsetWidth;
                    countdownText.style.animation = 'popScale 0.85s ease-out infinite';
                }
                if (countdownTimer <= 0) {
                    countdownOverlay.classList.add('hidden');
                    pauseBtn.style.display = 'flex';
                    gameState = 'PLAYING';
                }
                return;
            }

            // Update Starfield
            const starSpeedBoost = gameState === 'PLAYING' ? 1.6 : 0.6;
            stars.forEach(star => {
                star.y += star.speed * starSpeedBoost * dt;
                if (star.y > height) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
            });

            // Update Screen Shake
            if (screenShake > 0) {
                screenShake = Math.max(0, screenShake - dt * 45);
            }

            // Update Click/Touch Visual Ripples
            for (let i = touchIndicators.length - 1; i >= 0; i--) {
                const ind = touchIndicators[i];
                ind.radius += 160 * dt;
                ind.alpha -= 1.6 * dt;
                if (ind.alpha <= 0) {
                    touchIndicators.splice(i, 1);
                }
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.alpha -= p.decay * dt;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            if (gameState !== 'PLAYING') return;

            // Rocket Horizontal Movement
            if (inputDir !== 0) {
                rocket.vx += inputDir * rocket.accel * dt;
                if (rocket.vx > rocket.maxSpeed) rocket.vx = rocket.maxSpeed;
                if (rocket.vx < -rocket.maxSpeed) rocket.vx = -rocket.maxSpeed;
                rocket.targetAngle = inputDir * rocket.maxTilt;
            } else {
                // Smoothly decelerate horizontal drift when released
                if (Math.abs(rocket.vx) < rocket.friction * dt) {
                    rocket.vx = 0;
                } else {
                    rocket.vx -= Math.sign(rocket.vx) * rocket.friction * dt;
                }
                rocket.targetAngle = 0;
            }

            // Critically damped spring interpolation for silky, non-jerky banking & straightening
            const stiffness = 68;
            const damping = 16.5;
            const angularAccel = (rocket.targetAngle - rocket.angle) * stiffness - rocket.angleVel * damping;
            rocket.angleVel += angularAccel * dt;
            rocket.angle += rocket.angleVel * dt;

            // Apply horizontal movement & clamp to screen edges
            rocket.x += rocket.vx * dt;
            const halfW = rocket.width * 0.65;
            if (rocket.x < halfW) {
                rocket.x = halfW;
                rocket.vx = 0;
            } else if (rocket.x > width - halfW) {
                rocket.x = width - halfW;
                rocket.vx = 0;
            }

            // Track if rocket stays in roughly the same spot for > 6 seconds
            if (Math.abs(rocket.x - lastCheckedX) < 28 && inputDir === 0) {
                idleTime += dt;
                if (idleTime >= 6.0) {
                    // Launch a 2x-speed asteroid straight down at the rocket's current X position
                    spawnAsteroid(rocket.x);
                    sniperWarningTimer = 0.85;
                    idleTime = 0; // Reset timer so another fires if they stay parked 6 more seconds
                }
            } else {
                idleTime = 0;
                lastCheckedX = rocket.x;
            }

            if (sniperWarningTimer > 0) {
                sniperWarningTimer = Math.max(0, sniperWarningTimer - dt);
            }

            // Emit continuous thruster exhaust
            emitExhaust();

            // Spawn Regular Asteroids at randomized positions & scaling intervals
            spawnTimer -= dt;
            if (spawnTimer <= 0) {
                spawnAsteroid();
                const minInterval = Math.max(0.24, 0.75 - score * 0.008);
                spawnTimer = minInterval + Math.random() * 0.35;
            }

            // Update Asteroids & Check Collisions
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const ast = asteroids[i];
                ast.x += ast.vx * dt;
                ast.y += ast.vy * dt;
                ast.angle += ast.rotSpeed * dt;

                // Bounce softly off side walls
                if (ast.x < ast.radius) {
                    ast.x = ast.radius;
                    ast.vx *= -1;
                } else if (ast.x > width - ast.radius) {
                    ast.x = width - ast.radius;
                    ast.vx *= -1;
                }

                // Score point when asteroid safely passes the rocket
                if (!ast.passed && ast.y - ast.radius > rocket.y + rocket.height * 0.4) {
                    ast.passed = true;
                    score++;
                    scoreDisplay.textContent = score;
                }

                // Remove off-screen asteroids
                if (ast.y - ast.radius > height + 50) {
                    asteroids.splice(i, 1);
                    continue;
                }

                // Forgiving Circular Hitbox Collision Check
                const dx = ast.x - rocket.x;
                const dy = ast.y - (rocket.y + 4);
                const dist = Math.hypot(dx, dy);
                const rocketHitRadius = rocket.width * 0.42;
                const astHitRadius = ast.radius * 0.82;

                if (dist < rocketHitRadius + astHitRadius) {
                    triggerGameOver();
                    return;
                }
            }
        }

        // Main Render Loop
        function draw() {
            ctx.save();

            // Deep Space Gradient Background
            const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
            bgGrad.addColorStop(0, '#050814');
            bgGrad.addColorStop(1, '#0f172a');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // Apply Camera Shake on Impact
            if (screenShake > 0) {
                const sx = (Math.random() - 0.5) * screenShake;
                const sy = (Math.random() - 0.5) * screenShake;
                ctx.translate(sx, sy);
            }

            // Draw Stars
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Subtle side-glow when actively steering left or right
            if (gameState === 'PLAYING' && inputDir !== 0) {
                const sideGrad = ctx.createLinearGradient(
                    inputDir === -1 ? 0 : width,
                    0,
                    width / 2,
                    0
                );
                sideGrad.addColorStop(0, 'rgba(56, 189, 248, 0.12)');
                sideGrad.addColorStop(1, 'rgba(56, 189, 248, 0)');
                ctx.fillStyle = sideGrad;
                ctx.fillRect(inputDir === -1 ? 0 : width / 2, 0, width / 2, height);
            }

            // Draw Touch/Click Ripples
            touchIndicators.forEach(ind => {
                ctx.strokeStyle = `rgba(56, 189, 248, ${ind.alpha})`;
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(ind.x, ind.y, ind.radius, 0, Math.PI * 2);
                ctx.stroke();
            });

            // Draw Exhaust & Explosion Particles
            particles.forEach(p => {
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Draw Asteroids
            asteroids.forEach(drawAsteroid);

            // Draw Rocket
            drawRocket();

            ctx.restore();
        }

        function gameLoop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            update(dt);
            draw();

            requestAnimationFrame(gameLoop);
        }

        // Boot Game
        initStars();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
